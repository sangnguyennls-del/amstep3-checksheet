# Pha 8 (Task 2) — ping định kỳ giữ Supabase free tier khỏi bị tạm ngưng
# (pause sau 7 ngày không có hoạt động DB thật). Xem
# docs/plans/pha8-audit-cron.md mục "Bối cảnh" + "Task 2".
#
# Lịch: mỗi 3 ngày (an toàn dưới ngưỡng pause 7 ngày) + cho phép chạy thủ công
# qua workflow_dispatch.
name: Supabase keep-alive ping

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Ping Supabase
        run: node scripts/audit/ping.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
