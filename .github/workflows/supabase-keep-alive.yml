# Pha 8 (Task 2) — ping định kỳ giữ Supabase free tier khỏi bị tạm ngưng
# (pause sau 7 ngày không có hoạt động DB thật). Xem
# docs/plans/pha8-audit-cron.md mục "Bối cảnh" + "Task 2".
#
# Lịch: `*/3` trên field ngày-trong-tháng KHÔNG có nghĩa "mỗi 3 ngày" theo kiểu
# rolling -- nó reset về ngày 1 mỗi tháng (vd chạy ngày 1,4,...,28,31 rồi lại
# ngày 1 tháng sau). Đã tính kỹ: vì mọi tháng đều bắt đầu lại từ ngày 1 và lần
# chạy cuối trong tháng luôn cách cuối tháng tối đa 2 ngày, khoảng cách xa nhất
# giữa 2 lần chạy liên tiếp (kể cả qua ranh giới tháng bất kỳ, kể cả năm nhuận)
# không bao giờ vượt quá 3 ngày -- vẫn an toàn dưới ngưỡng pause 7 ngày, đủ dư
# để chịu được 1 lần chạy bị lỗi/trễ liên tiếp. Cho phép chạy thủ công qua
# workflow_dispatch.
name: Supabase keep-alive ping

on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Ping Supabase
        run: node scripts/audit/ping.ts
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
